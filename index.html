<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Patio y Flota</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Pestañas Principales -->
  <nav class="nav-tabs">
    <button class="tab-btn active" onclick="verTab('tab-buscador')">🔍 Buscador Master</button>
    <button class="tab-btn" onclick="verTab('tab-formado')">🚛 En Formado / Carga</button>
    <button class="tab-btn" onclick="verTab('tab-patio')">📍 Patio & Estatus</button>
  </nav>

  <!-- TAB 1: BUSCADOR MASTER POOL -->
  <section id="tab-buscador" class="tab-content active">
    <div class="card">
      <h2>Buscador Ficha Técnica (Master Pool)</h2>
      <input type="text" id="input-busqueda" placeholder="Ingrese Económico o Placa..." onkeyup="buscarRemolqueMaster()">
      <div style="margin-top: 10px;">
        <input type="file" id="file-input" accept=".csv" onchange="importarMasterCSV(event)">
        <button class="btn btn-warning" onclick="document.getElementById('file-input').click()">📁 Cargar Master Pool (CSV/Excel)</button>
      </div>
    </div>

    <div class="card hidden" id="resultado-master">
      <h2>Ficha Técnica del Remolque</h2>
      <div class="data-grid">
        <div class="data-item"><span class="data-label">Placa</span><span class="data-value" id="m-placa">-</span></div>
        <div class="data-item"><span class="data-label">Económico</span><span class="data-value" id="m-eco">-</span></div>
        <div class="data-item"><span class="data-label">Capacidad</span><span class="data-value" id="m-capacidad">-</span></div>
        <div class="data-item"><span class="data-label">CeDis Responsable</span><span class="data-value" id="m-cedis">-</span></div>
        <div class="data-item"><span class="data-label">Tipo de Puerta</span><span class="data-value" id="m-puerta">-</span></div>
        <div class="data-item"><span class="data-label">Modelo / Serie</span><span class="data-value" id="m-serie">-</span></div>
        <div class="data-item"><span class="data-label">Arrendador</span><span class="data-value" id="m-arrendador">-</span></div>
        <div class="data-item"><span class="data-label">Categoría</span><span class="data-value" id="m-categoria">-</span></div>
      </div>
      <div class="actions-row">
        <button class="btn btn-warning" onclick="enviarAFormado()">Mover a "En Carga"</button>
        <button class="btn btn-primary" onclick="enviarAPatioDirecto()">Ingresar a Patio</button>
      </div>
    </div>
  </section>

  <!-- TAB 2: EN FORMADO / CARGA -->
  <section id="tab-formado" class="tab-content">
    <div class="card">
      <h2>Ingreso a Proceso de Carga</h2>
      <div class="form-grid">
        <input type="text" id="f-eco" placeholder="Económico">
        <input type="text" id="f-placa" placeholder="Placa">
      </div>
      <label class="input-label">Fecha y Hora de Inicio de Carga:</label>
      <input type="datetime-local" id="f-inicio">
      <button class="btn btn-warning full-width" onclick="registrarProcesoCarga()">Iniciar Proceso de Carga</button>
    </div>

    <div class="card">
      <h2>Unidades Actualmente en Carga</h2>
      <div id="lista-formado"></div>
    </div>
  </section>

  <!-- TAB 3: PATIO & ESTATUS -->
  <section id="tab-patio" class="tab-content">
    <div class="card">
      <h2>Unidades en Patio CEDIS</h2>
      <div id="lista-patio"></div>
    </div>
  </section>

  <script src="app.js"></script>
</body>
</html>
